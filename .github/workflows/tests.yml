name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_grid.py -v

  mesh-crosswalk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyproj==3.8.0 shapely==2.1.2
      - run: python -m unittest discover -s tests -p test_mesh_crosswalk.py -v

  qgis-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install QGIS
        run: |
          sudo apt-get update
          sudo apt-get install --yes qgis python3-qgis
      - name: Run QGIS integration tests
        run: QT_QPA_PLATFORM=offscreen PYTHONPATH=. /usr/bin/python3 -m unittest tests/test_qgis_integration.py -v

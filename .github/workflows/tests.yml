name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_grid.py -v
      - run: python -m unittest discover -s tests -p test_metadata.py -v

  package-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build plugin ZIP from the checked-out commit
        run: python scripts/build_plugin_zip.py --commit "$GITHUB_SHA"
      - name: Install detect-secrets
        run: python -m pip install detect-secrets
      - name: Scan the packaged plugin files
        run: |
          temp_dir="$(mktemp -d)"
          unzip -q dist/forest_map_sheet_generator-0.1.1.zip -d "$temp_dir"
          cd "$temp_dir/forest_map_sheet_generator"
          detect-secrets scan --all-files > "$RUNNER_TEMP/detect-secrets-results.json"
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path(__import__("os").environ["RUNNER_TEMP"], "detect-secrets-results.json").read_text())
          findings = [item for items in report.get("results", {}).values() for item in items]
          if findings:
              for finding in findings:
                  print(finding)
              raise SystemExit(f"detect-secrets found {len(findings)} issue(s)")
          print("detect-secrets found no issues in the packaged plugin")
          PY

  mesh-crosswalk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyproj==3.8.0 shapely==2.1.2
      - run: python -m unittest discover -s tests -p test_mesh_crosswalk.py -v

  qgis-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install QGIS
        run: |
          sudo apt-get update
          sudo apt-get install --yes qgis python3-qgis
      - name: Run QGIS integration tests
        run: QT_QPA_PLATFORM=offscreen PYTHONPATH=. /usr/bin/python3 -m unittest tests/test_qgis_integration.py -v
